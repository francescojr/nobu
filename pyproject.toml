[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobu"
version = "0.2.1"
description = "Game-agnostic MCP server and toolkit for composing chiptune/retro MIDI and rendering game audio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "nobu contributors" }]
keywords = ["mcp", "midi", "chiptune", "game-audio", "vgm", "soundfont"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "fastmcp>=2.0",
  "midiutil>=1.2",
  "mido>=1.3",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
render = ["tinysoundfont==0.3.7"]

[project.scripts]
nobu-mcp = "nobu_mcp:main"

[project.urls]
Homepage = "https://github.com/francescojr/nobu"
Repository = "https://github.com/francescojr/nobu"
Changelog = "https://github.com/francescojr/nobu/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["nobu_mcp", "nobu_render"]
